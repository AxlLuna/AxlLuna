name: Redraw profile

on:
  schedule:
    # 13:00 UTC ≈ 6 am in Las Vegas (PDT). Once a day is plenty: GitHub
    # caches README images for a good while anyway.
    - cron: "0 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    name: Animated terminal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the terminal
        # To make the numbers include work in private repos:
        #   1. create a classic PAT with the `read:user` scope
        #   2. store it as a repository secret named PROFILE_TOKEN
        #   3. turn on Settings → Profile → "Include private contributions"
        # Without PROFILE_TOKEN this still works, but counts public only.
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-terminal.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Redraw profile"
            git push
          fi
